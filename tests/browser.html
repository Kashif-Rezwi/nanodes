<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nanodes · Source comparison</title>
  <style>
    :root { color-scheme: dark; background: #101112; color: #eeeef0; font: 16px/1.6 system-ui, sans-serif; }
    body { margin: 0; }
    main { max-width: 1100px; margin: auto; padding: 32px; }
    button { padding: 8px 16px; font: inherit; cursor: pointer; }
    #result { white-space: pre-wrap; }
    .comparison { display: flex; flex-wrap: wrap; gap: 24px; }
    .comparison > div { min-width: 0; }
    iframe { width: 400px; max-width: 100%; height: 400px; border: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Portfolio source / extraction</h1>
    <p>Generate the local source fixtures with <code>npm run reference -- /path/to/portfolio</code>.</p>
    <button id="run" type="button">Run deterministic comparison</button>
    <pre id="result" role="status">Ready.</pre>
    <section class="comparison" aria-label="Source comparison">
      <div>
        <h2>Original source</h2>
        <iframe title="Original portfolio contact" id="original" src="/.reference/contact.html?test"></iframe>
      </div>
      <div>
        <h2>Nanodes extraction</h2>
        <iframe title="Extracted contact" id="extracted" src="/tests/extracted.html?test"></iframe>
      </div>
    </section>
  </main>
  <script type="module" src="/tests/browser.mjs"></script>
</body>
</html>
